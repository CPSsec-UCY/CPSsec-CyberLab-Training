name: Site or lab bug
description: Report a broken page, animation, Wasm lab or accessibility issue
title: "[bug] "
labels: []
body:
  - type: input
    id: page
    attributes:
      label: Page URL or route
      placeholder: e.g. /lab/ or /learn/ml-kem/
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include browser, OS, and whether the Wasm engine or the TypeScript fallback was active.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output or screenshots
      description: Paste relevant errors. Do not include secrets.
